[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chestniy-znak-desktop"
version = "1.0.1"
description = "Desktop-клиент Честного знака для COM/SPP-сканеров."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyserial>=3.5",
    "PySide6>=6.7,<6.8",
]

[project.optional-dependencies]
dev = [
    "black>=24.4",
    "flake8>=7.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "types-pyserial>=3.5.0.20240311",
]
build = [
    "pyinstaller>=6.8",
]

[project.scripts]
chestniy-znak-desktop = "chestniy_znak_desktop.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chestniy_znak_desktop = ["resources/sounds/*.mp3", "resources/icons/*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
mypy_path = "src"
packages = ["chestniy_znak_desktop"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "serial.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/chestniy_znak_desktop"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
