repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: ./.venv/bin/python -m black --check .
        language: system
        pass_filenames: false
      - id: flake8
        name: flake8
        entry: ./.venv/bin/python -m flake8
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: ./.venv/bin/python -m mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: ./.venv/bin/python -m pytest
        language: system
        pass_filenames: false
